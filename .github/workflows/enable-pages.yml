name: Enable GitHub Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from gh-pages root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          echo "---- create pages (gh-pages /) ----"
          gh api --method POST "repos/${REPO}/pages" \
            -f "source[branch]=gh-pages" \
            -f "source[path]=/" \
            -f "build_type=legacy"
          echo "create_legacy_exit:$?"
          echo "---- create pages (workflow build type) ----"
          gh api --method POST "repos/${REPO}/pages" -f "build_type=workflow"
          echo "create_workflow_exit:$?"
          echo "---- get pages ----"
          gh api "repos/${REPO}/pages"
          echo "get_pages_exit:$?"
          echo "---- repo visibility ----"
          gh api "repos/${REPO}" --jq '{private:.private,visibility:.visibility,has_pages:.has_pages}'
          echo "---- make public if pages is blocked by plan ----"
          gh api --method PATCH "repos/${REPO}" -f visibility=public
          echo "visibility_exit:$?"
          echo "---- retry create pages after visibility ----"
          gh api --method POST "repos/${REPO}/pages" \
            -f "source[branch]=gh-pages" \
            -f "source[path]=/" \
            -f "build_type=legacy"
          echo "retry_create_exit:$?"
          gh api --method PUT "repos/${REPO}/pages" \
            -f "source[branch]=gh-pages" \
            -f "source[path]=/"
          echo "put_exit:$?"
          echo "---- final ----"
          gh api "repos/${REPO}" --jq '{private:.private,visibility:.visibility,has_pages:.has_pages}'
          gh api "repos/${REPO}/pages"
